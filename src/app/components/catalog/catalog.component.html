<!-- Header -->
<header class="catalog-header">
  <div class="container">
    <div class="logo">A</div>
    <div class="brand">
      <h1>site</h1>
      <p>Movimento • Força • Estilo</p>
    </div>
    <button class="admin-access" (click)="openAdmin()">
      <i class="lock-icon"></i>
    </button>
  </div>
</header>

<main class="catalog-main">
  <div class="container">
    <div class="catalog-intro">
      <h2>Coleção 2024</h2>
      <p>Descubra a força e elegância inspiradas na Grécia antiga</p>
    </div>

    <div class="products-grid">
      <div class="product-card" *ngFor="let product of products">
        <div class="product-image">
          <img [src]="product.image" [alt]="product.name">
          <div class="product-badge">Novo</div>
        </div>
        <div class="product-info">
          <h3>{{ product.name }}</h3>
          <p class="product-description">{{ product.description }}</p>
          
          <div class="product-colors">
            <p>Cores disponíveis:</p>
            <div class="colors-list">
              <span *ngFor="let color of product.colors" class="color-tag">{{ color }}</span>
            </div>
          </div>

          <div class="product-sizes">
            <p>Tamanhos:</p>
            <div class="sizes-list">
              <span *ngFor="let size of product.sizes" class="size-tag">{{ size }}</span>
            </div>
          </div>

          <div class="product-footer">
            <p class="product-price">R$ {{ product.price.toFixed(2) }}</p>
            <button class="btn-more">Ver Mais</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- WhatsApp Float -->
<div class="whatsapp-float" (click)="redirectToWhatsApp()">
  <img src="assets/images/whatsapp-icon.png" alt="WhatsApp">
</div>
