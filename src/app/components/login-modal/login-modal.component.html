<div class="login-modal-overlay" (click)="onClose()">
  <div class="login-modal" (click)="onModalClick($event)">

    <button class="close-btn" (click)="onClose()" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="20">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>

    <div class="login-header">
      <div class="logo-icon">A</div>
      <h2>site<span class="plus">+</span></h2>
      <p *ngIf="tab !== 'admin'">Acesse sua conta ou cadastre-se</p>
      <p *ngIf="tab === 'admin'" class="admin-badge">🔒 Acesso administrativo</p>
    </div>

    <!-- Tabs -->
    <div class="tabs" *ngIf="tab !== 'admin'">
      <button [class.active]="tab === 'login'" (click)="setTab('login')">Entrar</button>
      <button [class.active]="tab === 'cadastro'" (click)="setTab('cadastro')">Cadastrar</button>
    </div>

    <!-- Login -->
    <form *ngIf="tab === 'login'" (ngSubmit)="login()" class="login-form">
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" [(ngModel)]="loginData.email" name="email" placeholder="seu@email.com" required>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" [(ngModel)]="loginData.password" name="password" placeholder="••••••••" required>
      </div>
      <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
      <button type="submit" class="login-btn">Entrar</button>
    </form>

    <!-- Cadastro -->
    <form *ngIf="tab === 'cadastro'" (ngSubmit)="cadastrar()" class="login-form">
      <div class="form-group">
        <label>Nome completo</label>
        <input type="text" [(ngModel)]="cadastroData.name" name="name" placeholder="Seu nome" required>
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" [(ngModel)]="cadastroData.email" name="email" placeholder="seu@email.com" required>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" [(ngModel)]="cadastroData.password" name="password" placeholder="Mín. 6 caracteres" required>
      </div>
      <div class="form-group">
        <label>Confirmar senha</label>
        <input type="password" [(ngModel)]="cadastroData.confirm" name="confirm" placeholder="••••••••" required>
      </div>
      <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
      <button type="submit" class="login-btn">Criar conta</button>
    </form>

    <!-- Admin -->
    <form *ngIf="tab === 'admin'" (ngSubmit)="loginAdmin()" class="login-form">
      <div class="form-group">
        <label>E-mail do administrador</label>
        <input type="email" [(ngModel)]="adminData.email" name="adminEmail" placeholder="admin@email.com" required>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" [(ngModel)]="adminData.password" name="adminPassword" placeholder="••••••••" required>
      </div>
      <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
      <button type="submit" class="login-btn" [disabled]="loading">
        {{ loading ? 'Verificando...' : 'Entrar como admin' }}
      </button>
    </form>

    <!-- Divisor -->
    <div class="divider" *ngIf="tab !== 'admin'"><span>ou</span></div>

    <!-- Google -->
    <button *ngIf="tab !== 'admin'" class="google-btn" type="button" (click)="loginGoogle()">
      <svg viewBox="0 0 24 24" width="18">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continuar com Google
    </button>

    <!-- Alternar acesso admin -->
    <button *ngIf="tab !== 'admin'" class="admin-link" type="button" (click)="setTab('admin')">
      Acessar como administrador
    </button>
    <button *ngIf="tab === 'admin'" class="admin-link" type="button" (click)="setTab('login')">
      ← Voltar para acesso de cliente
    </button>

  </div>
</div>
